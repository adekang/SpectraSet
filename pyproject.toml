[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraset-ftir"
version = "0.1.0"
description = "Ordered spectral-state modeling for FTIR functional-group identification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.scripts]
spectraset-evaluate = "evaluate:main"
spectraset-train = "train:main"

[project.optional-dependencies]
eval = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
]
test = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pytest>=7",
    "scikit-learn>=1.3",
]

[tool.setuptools]
py-modules = ["evaluate", "spectraset", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
